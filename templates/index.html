<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity Quiz</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1d3327;
            --text: #f1ecdc;
            --muted: #b7b9a6;
            --accent: #f2c230;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3rem;
            padding: 2rem clamp(1.25rem, 6vw, 4rem);
            background: var(--bg);
            color: var(--text);
            font-family: 'Manrope', system-ui, sans-serif;
            line-height: 1.6;
        }

        main { max-width: 30rem; }

        .logo {
            display: block;
            width: 88px;
            height: 88px;
            margin-bottom: 1.75rem;
            border-radius: 50%;
            object-fit: cover;
            outline: 2px solid var(--accent);
            outline-offset: 5px;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.15;
        }

        p { margin: 0 0 1.75rem; color: var(--muted); text-wrap: pretty; }

        .links { display: flex; flex-wrap: wrap; gap: 0.75rem; }

        .btn {
            padding: 0.7rem 1.25rem;
            border: 2px solid var(--muted);
            border-radius: 8px;
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
        }

        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

        .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        .btn-primary:hover { background: #ffd24d; border-color: #ffd24d; color: var(--bg); }

        footer { max-width: 30rem; font-size: 0.875rem; color: var(--muted); text-wrap: pretty; }
    </style>
</head>
<body>
    <main>
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo de Verity Quiz" class="logo">
        <h1>Verity Quiz</h1>
        <p>Bot de trivia para Discord. Esta página mantiene el bot activo y da acceso a él.</p>
        <div class="links">
            <a href="{{ invite_url }}" target="_blank" rel="noopener" class="btn btn-primary">Añadir a Discord</a>
            <a href="{{ github_url }}" target="_blank" rel="noopener" class="btn">Ver el código</a>
        </div>
    </main>

    <footer>
        Esta página y el bot de Discord forman parte de la prueba de competencias duras para impartir el curso Python Pro en Kodland Latam.
    </footer>
</body>
</html>
