<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Quiz Discord</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1e1b;
            --card-bg: #242925;
            --primary-yellow: #facc15;
            --secondary-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #2a332c 0%, transparent 70%);
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            /* Animación de entrada */
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 24px;
            border: 4px solid var(--primary-yellow);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
        }

        h1 {
            font-weight: 800;
            font-size: 24px;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary {
            background-color: var(--primary-yellow);
            color: #000000;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--secondary-green);
            color: var(--secondary-green);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo del Bot" class="logo">
        
        <h1>Verity Quiz</h1>
        <p>Un bot interactivo de preguntas y respuestas para tu servidor de Discord.</p>
        
        <div class="buttons">
            <a href="{{ invite_url }}" target="_blank" class="btn btn-primary">Añadir a Discord</a>
            <a href="{{ github_url }}" target="_blank" class="btn btn-secondary">Ver Código Fuente</a>
        </div>
    </div>
</body>
</html>
